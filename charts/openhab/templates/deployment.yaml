apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openhab
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
            - |
              set -ex

              # 1. load variables
              ADMIN_HASH=$(cat /var/run/secrets/auth/admin-hash)
              ADMIN_SALT=$(cat /var/run/secrets/auth/admin-salt)

              USERDATA="/openhab/userdata"
              CONF="/openhab/conf"
              JSONDB="$USERDATA/jsondb"

              # Version tracking and automatic upgrades
              VERSION_FILE="$USERDATA/.openhab-version"
              CURRENT_VERSION="{{ .Values.image.tag }}"

              # Get installed version (if exists)
              if [ -f "$VERSION_FILE" ]; then
                INSTALLED_VERSION=$(cat "$VERSION_FILE")
              else
                INSTALLED_VERSION="none"
              fi

              echo "Current image version: $CURRENT_VERSION"
              echo "Installed data version: $INSTALLED_VERSION"

              # init config files
              if [ ! -d "$CONF/services" ]; then
                echo "Initializing config directory..."
                cp -rL /openhab/dist/conf/* "$CONF/"
              fi

              # init or upgrade user directory
              if [ "$INSTALLED_VERSION" != "$CURRENT_VERSION" ]; then
                if [ "$INSTALLED_VERSION" = "none" ]; then
                  echo "Fresh installation - initializing userdata..."
                  cp -rL /openhab/dist/userdata/* "$USERDATA/"
                else
                  echo "Version changed from $INSTALLED_VERSION to $CURRENT_VERSION - upgrading..."

                  # Backup critical user data
                  BACKUP_DIR="$USERDATA/.upgrade-backup-$(date +%s)"
                  mkdir -p "$BACKUP_DIR"
                  [ -d "$JSONDB" ] && cp -r "$JSONDB" "$BACKUP_DIR/" || true
                  [ -f "$USERDATA/etc/org.openhab.addons.cfg" ] && cp "$USERDATA/etc/org.openhab.addons.cfg" "$BACKUP_DIR/" || true
                  echo "Backed up user data to $BACKUP_DIR"

                  # Remove old version files (but keep logs, jsondb, cache for faster startup)
                  rm -rf "$USERDATA/etc"

                  # Copy new version files
                  cp -rL /openhab/dist/userdata/* "$USERDATA/"

                  # Restore backed up user data
                  [ -d "$BACKUP_DIR/jsondb" ] && cp -r "$BACKUP_DIR/jsondb"/* "$JSONDB/" || true

                  echo "Upgrade completed"
                fi

                # Update version file
                echo "$CURRENT_VERSION" > "$VERSION_FILE"
              fi

              mkdir -p "$JSONDB"

              # 2. users.json creation
              cat <<EOF > "$JSONDB/users.json"
              {
                "{{ .Values.openhab.setup.adminUser }}": {
                  "class": "org.openhab.core.auth.ManagedUser",
                  "value": {
                    "name": "{{ .Values.openhab.setup.adminUser }}",
                    "passwordHash": "$ADMIN_HASH",
                    "passwordSalt": "$ADMIN_SALT",
                    "roles": ["administrator"],
                    "sessions": [],
                    "apiTokens": []
                  }
                }
              }
              EOF

              # 3. copy init files (UI Pages etc.)
              if [ -d "/etc/openhab-init" ]; then
                echo "Copying UI pages and init files..."
                cp /etc/openhab-init/*.json "$JSONDB/"
              fi

              # 4. link things, items etc. from static map
              if [ -d "/etc/openhab-static" ]; then
                for f in /etc/openhab-static/*; do
                  [ -e "$f" ] || continue
                  filename=$(basename "$f")
                  extension="${filename##*.}"
                  
                  case "$extension" in
                    things)   target_subdir="things" ;;
                    items)    target_subdir="items" ;;
                    sitemaps) target_subdir="sitemaps" ;;
                    rules)    target_subdir="rules" ;;
                    cfg)      target_subdir="services" ;; #addons.cfg -> services/
                    persist)  target_subdir="persistence" ;;
                    script)   target_subdir="scripts" ;;
                    *)        target_subdir="$extension" ;;
                  esac

                  target_dir="$CONF/$target_subdir"
                  mkdir -p "$target_dir"
                  cp "$f" "$target_dir/"
                  echo "Linked $filename to $target_dir/"
                done
              fi

              echo "--- Bootstrap finished ---"
              exec ./start.sh run          
          volumeMounts:
            - name: userdata
              mountPath: /openhab/userdata
            - name: openhab-conf
              mountPath: /openhab/conf
            - name: init-files
              mountPath: /etc/openhab-init
            - name: static-files
              mountPath: /etc/openhab-static
            - name: auth-volume
              mountPath: /var/run/secrets/auth
              readOnly: true
      volumes:
        - name: userdata
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default "openhab-pvc" }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: openhab-conf
          emptyDir: {}
        - name: init-files
          configMap:
            {{ $pages := index .Values.openhab.setup "pages" -}}
            name: {{ (and $pages $pages.existingConfigMap) | default (printf "%s-jsondb" .Release.Name) }}
        - name: static-files
          configMap:
            name: {{ .Release.Name }}-static-config
        - name: auth-volume
          projected:
            sources:
              - secret:
                  {{- if .Values.openhab.setup.passwordHash.secretRef }}
                  name: {{ .Values.openhab.setup.passwordHash.secretRef.name }}
                  items: [{ key: {{ .Values.openhab.setup.passwordHash.secretRef.key }}, path: "admin-hash" }]
                  {{- else }}
                  name: {{ .Release.Name }}-auth-internal
                  items: [{ key: "passwordHash", path: "admin-hash" }]
                  {{- end }}
              - secret:
                  {{- if .Values.openhab.setup.passwordSalt.secretRef }}
                  name: {{ .Values.openhab.setup.passwordSalt.secretRef.name }}
                  items: [{ key: {{ .Values.openhab.setup.passwordSalt.secretRef.key }}, path: "admin-salt" }]
                  {{- else }}
                  name: {{ .Release.Name }}-auth-internal
                  items: [{ key: "passwordSalt", path: "admin-salt" }]
                  {{- end }}
