apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: {{ .Release.Name }}-cert
spec:
  secretName: {{ .Values.network.host }}
  duration: 2160h # 90d
  renewBefore: 360h # 15d
  issuerRef:
    name: {{ .Values.network.certificate.issuerName }}
    kind: {{ .Values.network.certificate.issuerKind }}
  commonName: {{ .Values.network.host }}
  dnsNames:
    - {{ .Values.network.host }}
