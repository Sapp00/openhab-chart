{{- if .Values.openhab.setup.pages }}
  {{- if not .Values.openhab.setup.pages.existingConfigMap }}apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-jsondb
data:
  uicomponents_ui_page.json: |
    {
      "overview": {
        "class": "org.openhab.core.ui.components.RootUIComponent",
        "value": {
          "uid": "overview",
          "tags": [],
          "props": { "parameters": [], "parameterGroups": [] },
          "timestamp": {{ now | date "Jan 2, 2006, 3:04:05 PM" | quote }},
          "component": "oh-layout-page",
          "config": { "label": "Overview" },
          "slots": { "default": [] }
        }
      }
    }
  {{- end }}
{{- end }}
