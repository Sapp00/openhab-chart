# ==============================================================================
# openHAB Helm Chart - Best Practice Values
# ==============================================================================
# Default values follow the 'Restricted' Pod Security Standard.

## @section Global parameters
##

## @param replicaCount Number of openHAB nodes (Recommended: 1)
replicaCount: 1

## @section Image parameters
##

image:
  ## @param image.repository openHAB image repository
  repository: openhab/openhab
  ## @param image.tag openHAB image tag
  tag: 4.2.1
  ## @param image.pullPolicy Image pull policy
  pullPolicy: IfNotPresent

## @section Persistence parameters
##

persistence:
  ## @param persistence.enabled Enable PVC for userdata storage
  enabled: true
  ## @param persistence.storageClass Storage class name (e.g., freenas-iscsi-csi)
  storageClass: "freenas-iscsi-csi"
  ## @param persistence.size Size of the userdata volume
  size: 5Gi
  ## @param persistence.accessMode PVC Access Mode
  accessMode: ReadWriteOnce

## @section Network and Ingress parameters
##

network:
  ## @param network.host The DNS hostname for the openHAB instance
  host: "homeassistant.internal"
  ## @param network.port Internal openHAB HTTP port
  port: 8080
  ingress:
    ## @param network.ingress.enabled Enable Traefik IngressRoute
    enabled: true
    ## @param network.ingress.entryPoints Traefik entrypoints
    entryPoints: ["websecure"]
  certificate:
    ## @param network.certificate.issuerName Cert-manager issuer name
    issuerName: "ca-issuer"
    ## @param network.certificate.issuerKind Cert-manager issuer kind
    issuerKind: "ClusterIssuer"

## @section openHAB Application parameters
##

openhab:
  ## @subsection Setup & Authentication
  ## Handles the initial bootstrapping of the admin user and UI to skip the wizard.
  setup:
    ## @param openhab.setup.adminUser The username for the primary administrator
    adminUser: "admin"

    ## @param openhab.setup.passwordHash Administrative password hash
    ## Provide 'value' (plaintext) OR 'secretRef' (external secret).
    passwordHash:
      ## @param openhab.setup.passwordHash.value Plaintext hash
      value: "nvJAbQ..." 
      ## @param openhab.setup.passwordHash.secretRef Reference to a pre-existing Secret
      # secretRef:
      #   name: "openhab-auth-credentials"
      #   key: "admin-password-hash"

    ## @param openhab.setup.passwordSalt Administrative password salt
    passwordSalt:
      ## @param openhab.setup.passwordSalt.value Plaintext salt
      value: "SiAs+Q..."
      ## @param openhab.setup.passwordSalt.secretRef Reference to a pre-existing Secret
      # secretRef:
      #   name: "openhab-auth-credentials"
      #   key: "admin-password-salt"

    ## @param openhab.setup.pages Default UI pages to initialize (Required to bypass Setup Wizard)
    pages:
      overview:
        label: "Overview"
        component: "oh-layout-page"

  ## @subsection System Environment
  ##
  env:
    ## @param openhab.env.timezone System timezone
    timezone: "Europe/Berlin"
    ## @param openhab.env.extraJavaOpts Additional Java properties
    extraJavaOpts: "-Dorg.eclipse.jetty.server.forwarded=true -Dorg.openhab.core.ui.setupwizard:setupWizard=false -Duser.timezone=Europe/Berlin -Djava.net.prefIPv4Stack=true"

  ## @subsection Dynamic Configuration Files
  ## These files are mapped into /openhab/conf/ subfolders based on extension.
  configFiles:
    "addons.cfg": |
      binding = mqtt,chromecast,shelly,matter
      ui = main
      persistence = rrd4j
      transformation = jsonpath,regex

    "shellies.things": |
      Bridge mqtt:broker:mosquitto "Mosquitto" [ host="mosquitto.svc.cluster.local", secure=false ] {
          Thing topic shelly_treppe {
              Channels:
                  Type switch : relay [ stateTopic="shellies/shelly1-8CAAB55D8025/relay/0", commandTopic="shellies/shelly1-8CAAB55D8025/relay/0/command", on="on", off="off" ]
          }
      }

    "chromecast.things": |
      Thing chromecast:chromecast:wohnzimmer "Fernseher" [ ipAddress="192.168.20.50", port=8009 ]

    "home.items": |
      Switch Licht_Treppe "Licht Treppe" <light> ["Light", "Switchable"] { channel="mqtt:topic:mosquitto:shelly_treppe:relay" }

## @section Resource management
##

resources:
  requests:
    cpu: 500m
    memory: 1Gi
  limits:
    cpu: "2"
    memory: 3Gi

## @section Security Context (Restricted PSA Compliance)
##

podSecurityContext:
  ## @param podSecurityContext.runAsNonRoot Enforce non-root user
  runAsNonRoot: true
  ## @param podSecurityContext.fsGroup Group ID for volume ownership (openHAB default: 9001)
  fsGroup: 9001
  ## @param podSecurityContext.seccompProfile Default seccomp profile for restricted PSA
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  ## @param containerSecurityContext.runAsUser User ID to run the container (openHAB default: 9001)
  runAsUser: 9001
  ## @param containerSecurityContext.runAsGroup Group ID to run the container (openHAB default: 9001)
  runAsGroup: 9001
  ## @param containerSecurityContext.allowPrivilegeEscalation Disallow privilege escalation
  allowPrivilegeEscalation: false
  ## @param containerSecurityContext.readOnlyRootFilesystem Whether the root fs is read-only
  # Note: openHAB needs writes to /userdata and /conf, so keep false or use many mounts
  readOnlyRootFilesystem: false
  ## @param containerSecurityContext.capabilities Drop all capabilities for security
  capabilities:
    drop:
      - ALL
