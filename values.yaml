# ==============================================================================
# openHAB Helm Chart Values
# ==============================================================================

## @section Global parameters
##

## @param replicaCount Number of openHAB nodes (Note: openHAB 4 is typically RWO and works best with 1 replica)
replicaCount: 1

## @section Image parameters
##

image:
  ## @param image.repository openHAB image repository
  repository: openhab/openhab
  ## @param image.tag openHAB image tag (e.g., 4.2.1)
  tag: 4.2.1
  ## @param image.pullPolicy Image pull policy
  pullPolicy: IfNotPresent

## @section Persistence parameters
##

persistence:
  ## @param persistence.enabled Enable persistence using PVC
  enabled: true
  ## @param persistence.storageClass Storage class name (e.g., freenas-iscsi-csi)
  storageClass: "freenas-iscsi-csi"
  ## @param persistence.size Size of the persistent volume
  size: 5Gi
  ## @param persistence.accessMode PVC Access Mode
  accessMode: ReadWriteOnce

## @section Network and Ingress parameters
##

network:
  ## @param network.host The DNS hostname for the openHAB instance
  host: "homeassistant.internal"
  ## @param network.port Internal openHAB HTTP port
  port: 8080
  ingress:
    ## @param network.ingress.enabled Enable Traefik IngressRoute
    enabled: true
    ## @param network.ingress.entryPoints Traefik entrypoints
    entryPoints: ["websecure"]
  certificate:
    ## @param network.certificate.issuerName Cert-manager issuer name
    issuerName: "ca-issuer"
    ## @param network.certificate.issuerKind Cert-manager issuer kind (ClusterIssuer or Issuer)
    issuerKind: "ClusterIssuer"

## @section openHAB Application parameters
##

openhab:
  ## @subsection Setup & Authentication
  ## This section handles the initial bootstrapping of the admin user and UI.
  setup:
    ## @param openhab.setup.adminUser The username for the primary administrator
    adminUser: "admin"

    ## @param openhab.setup.passwordHash Administrative password hash
    ## Use EITHER 'value' for plaintext (not recommended) OR 'secretRef' to link an existing Secret.
    passwordHash:
      ## @param openhab.setup.passwordHash.value Plaintext hash
      value: "nvJAbQ..." 
      ## @param openhab.setup.passwordHash.secretRef Reference to an external secret
      # secretRef:
      #   name: "openhab-auth-credentials"
      #   key: "admin-password-hash"

    ## @param openhab.setup.passwordSalt Administrative password salt
    ## Use EITHER 'value' for plaintext OR 'secretRef' to link an existing Secret.
    passwordSalt:
      ## @param openhab.setup.passwordSalt.value Plaintext salt
      value: "SiAs+Q..."
      ## @param openhab.setup.passwordSalt.secretRef Reference to an external secret
      # secretRef:
      #   name: "openhab-auth-credentials"
      #   key: "admin-password-salt"

    ## @param openhab.setup.pages Default UI pages to initialize (Prevents Setup Wizard)
    pages:
      overview:
        label: "Overview"
        component: "oh-layout-page"

  ## @subsection System Environment
  ##
  env:
    ## @param openhab.env.timezone System timezone
    timezone: "Europe/Berlin"
    ## @param openhab.env.extraJavaOpts Additional Java properties (e.g. for proxying and disabling wizard)
    extraJavaOpts: "-Dorg.eclipse.jetty.server.forwarded=true -Dorg.openhab.core.ui.setupwizard:setupWizard=false -Duser.timezone=Europe/Berlin -Djava.net.prefIPv4Stack=true"

  ## @subsection Dynamic Configuration Files
  ## These files are automatically linked/copied into /openhab/conf/ based on their extensions.
  ## Supported: .things, .items, .cfg, .rules, .sitemaps, .script
  configFiles:
    "addons.cfg": |
      binding = mqtt,chromecast,shelly,matter
      ui = main
      persistence = rrd4j
      transformation = jsonpath,regex

    "shellies.things": |
      Bridge mqtt:broker:mosquitto "Mosquitto" [ host="mosquitto.svc.cluster.local", secure=false ] {
          Thing topic shelly_treppe {
              Channels:
                  Type switch : relay [ stateTopic="shellies/shelly1-81F89FBBA/relay/0", commandTopic="shellies/shelly1-81F89FBBA/relay/0/command", on="on", off="off" ]
          }
      }

    "chromecast.things": |
      Thing chromecast:chromecast:wohnzimmer "Fernseher" [ ipAddress="192.168.20.50", port=8009 ]

    "home.items": |
      Switch Licht_Treppe "Licht Treppe" <light> ["Light", "Switchable"] { channel="mqtt:topic:mosquitto:shelly_treppe:relay" }

## @section Resource management
##

resources:
  ## @param resources.requests.cpu CPU request
  ## @param resources.requests.memory Memory request
  requests:
    cpu: 500m
    memory: 1Gi
  ## @param resources.limits.cpu CPU limit
  ## @param resources.limits.memory Memory limit
  limits:
    cpu: "2"
    memory: 3Gi

## @section Security Context
##

podSecurityContext:
  ## @param podSecurityContext.fsGroup Group ID for file system ownership
  fsGroup: 9001

containerSecurityContext:
  ## @param containerSecurityContext.runAsUser User ID to run the container
  runAsUser: 9001
  ## @param containerSecurityContext.runAsGroup Group ID to run the container
  runAsGroup: 9001
  ## @param containerSecurityContext.allowPrivilegeEscalation Prevent privilege escalation
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL
