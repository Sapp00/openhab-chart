apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
    spec:
      {{- with .Values.podSecurityContext }}
      securityContext:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: openhab
          {{- with .Values.containerSecurityContext }}
          securityContext:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["/bin/bash", "-c"]
          args:
             - |
              set -ex
              
              # 1. READ FROM PROJECTED VOLUME (Professional way)
              # These files exist because we defined them in 'volumes' via 'projected'
              ADMIN_HASH=$(cat /var/run/secrets/auth/admin-hash)
              ADMIN_SALT=$(cat /var/run/secrets/auth/admin-salt)
              
              USERDATA="/openhab/userdata"
              JSONDB="$USERDATA/jsondb"
              
              [ ! -d "$USERDATA/etc" ] && cp -rL /openhab/dist/userdata/* "$USERDATA/"
              mkdir -p "$JSONDB"

              # 2. GENERATE users.json using SHELL variables (not Helm templates)
              # Note: We use \$ADMIN_HASH (escaped) or ensure Helm doesn't touch it.
              # In a multi-line string in Helm, just use $ADMIN_HASH.
              cat <<EOF > "$JSONDB/users.json"
              {
                "{{ .Values.openhab.setup.adminUser }}": {
                  "class": "org.openhab.core.auth.ManagedUser",
                  "value": {
                    "name": "{{ .Values.openhab.setup.adminUser }}",
                    "passwordHash": "$ADMIN_HASH",
                    "passwordSalt": "$ADMIN_SALT",
                    "roles": ["administrator"],
                    "sessions": [],
                    "apiTokens": []
                  }
                }
              }
              EOF 

              cp /etc/openhab-init/*.json "$JSONDB/"
              # (Rest des Skripts wie gehabt)
              exec ./start.sh run
          volumeMounts:
            - name: userdata
              mountPath: /openhab/userdata
            {{- if .Values.openhab.setup.pages }}
            - name: init-files
              mountPath: /etc/openhab-init
            {{- end }}
            - name: static-files
              mountPath: /etc/openhab-static
            - name: auth-volume
              mountPath: /var/run/secrets/auth
              readOnly: true
      volumes:
        - name: userdata
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            # Hier nutzen wir den Namen, den wir auch in pvc.yaml vergeben
            claimName: {{ .Values.persistence.existingClaim | default "openhab-pvc" }}
          {{- else }}
          emptyDir: {}
          {{- end }}
        - name: init-files
          secret:
            secretName: {{ .Release.Name }}-jsondb
        - name: static-files
          configMap:
            name: {{ .Release.Name }}-static-config
        - name: auth-volume
          projected:
            sources:
              - secret:
                  {{- if .Values.openhab.setup.passwordHash.secretRef }}
                  name: {{ .Values.openhab.setup.passwordHash.secretRef.name }}
                  items: [{ key: {{ .Values.openhab.setup.passwordHash.secretRef.key }}, path: "admin-hash" }]
                  {{- else }}
                  name: {{ .Release.Name }}-auth-internal
                  items: [{ key: "passwordHash", path: "admin-hash" }]
                  {{- end }}
              - secret:
                  {{- if .Values.openhab.setup.passwordSalt.secretRef }}
                  name: {{ .Values.openhab.setup.passwordSalt.secretRef.name }}
                  items: [{ key: {{ .Values.openhab.setup.passwordSalt.secretRef.key }}, path: "admin-salt" }]
                  {{- else }}
                  name: {{ .Release.Name }}-auth-internal
                  items: [{ key: "passwordSalt", path: "admin-salt" }]
                  {{- end }}
